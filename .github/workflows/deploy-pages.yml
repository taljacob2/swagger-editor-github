name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: swagger-editor/.nvmrc
          cache: npm
          cache-dependency-path: swagger-editor/package-lock.json

      - name: Install dependencies
        working-directory: swagger-editor
        run: npm ci

      # Only the standalone app build is needed for the Pages site (not the
      # embeddable esm/umd bundles that `npm run build` also produces).
      # --base matches this repo's Pages site path so asset URLs resolve.
      #
      # The default below (/<repo-name>/) is correct for a normal, publicly
      # published project-site URL like <org>.github.io/<repo-name>/. It is
      # WRONG for a *privately* published Pages site on GitHub Enterprise
      # Cloud: GHEC serves those from a unique subdomain (e.g.
      # <org>-<repo>.pages.<hostname>) with the site at that subdomain's
      # root, no /<repo-name>/ prefix. Building with the wrong base makes
      # every asset request 404, which GitHub Pages answers with its HTML
      # 404 page — surfacing in the browser as MIME-type/nosniff errors on
      # every JS/CSS/media request. Set a repo variable named
      # PAGES_BASE_PATH (Settings -> Secrets and variables -> Actions ->
      # Variables) to "/" to override this for such deployments.
      #
      # VITE_GITHUB_API_BASE_URL is optional: set a repo variable named
      # GH_API_BASE_URL (Settings -> Secrets and variables -> Actions ->
      # Variables) to bake in the right default for a GHEC custom domain, so
      # visitors don't have to type it in via Connection Settings. Left unset,
      # it falls back to https://api.github.com at runtime.
      #
      # Named GH_ rather than GITHUB_: GitHub Actions rejects any repo
      # variable name starting with the reserved GITHUB_ prefix (Settings
      # silently refuses to save it), so GITHUB_API_BASE_URL itself can't
      # exist as a variable name here even though the built app's own env
      # var (VITE_GITHUB_API_BASE_URL, set from this variable's value) isn't
      # affected -- that restriction only applies to vars./secrets. names,
      # not to arbitrary keys inside a workflow's own env: block.
      #
      # VITE_GITHUB_STORAGE_OWNER / VITE_GITHUB_STORAGE_REPO need no repo
      # variable at all -- github.repository_owner and
      # github.event.repository.name are always correct, straight from the
      # Actions context. The app uses these to default "Manage Aggregation
      # Sets" -> Storage location to this repo. Without them it falls back
      # to parsing the deployed hostname, which only works for a
      # <owner>.github.io/<repo>/ Pages URL -- a privately published GHEC
      # Pages site is served from a <owner>-<repo>.pages.<hostname>
      # subdomain instead, which can't be split back into owner/repo (see
      # detectDefaultOwnerRepo's doc comment in aggregation-storage-service.js).
      - name: Build app
        working-directory: swagger-editor
        env:
          VITE_GITHUB_API_BASE_URL: ${{ vars.GH_API_BASE_URL }}
          VITE_GITHUB_STORAGE_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_STORAGE_REPO: ${{ github.event.repository.name }}
        run: npm run build:app -- --base="${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: swagger-editor/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
