name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: swagger-editor/.nvmrc
          cache: npm
          cache-dependency-path: swagger-editor/package-lock.json

      - name: Install dependencies
        working-directory: swagger-editor
        run: npm ci

      # Only the standalone app build is needed for the Pages site (not the
      # embeddable esm/umd bundles that `npm run build` also produces).
      # --base matches this repo's Pages site path so asset URLs resolve.
      #
      # The default below (/<repo-name>/) is correct for a normal, publicly
      # published project-site URL like <org>.github.io/<repo-name>/. It is
      # WRONG for a *privately* published Pages site on GitHub Enterprise
      # Cloud: GHEC serves those from a unique subdomain (e.g.
      # <org>-<repo>.pages.<hostname>) with the site at that subdomain's
      # root, no /<repo-name>/ prefix. Building with the wrong base makes
      # every asset request 404, which GitHub Pages answers with its HTML
      # 404 page — surfacing in the browser as MIME-type/nosniff errors on
      # every JS/CSS/media request. Set a repo variable named
      # PAGES_BASE_PATH (Settings -> Secrets and variables -> Actions ->
      # Variables) to "/" to override this for such deployments.
      #
      # VITE_GITHUB_API_BASE_URL is optional: set a repo variable named
      # GITHUB_API_BASE_URL (Settings -> Secrets and variables -> Actions ->
      # Variables) to bake in the right default for a GHEC custom domain, so
      # visitors don't have to type it in via Connection Settings. Left unset,
      # it falls back to https://api.github.com at runtime.
      - name: Build app
        working-directory: swagger-editor
        env:
          VITE_GITHUB_API_BASE_URL: ${{ vars.GITHUB_API_BASE_URL }}
        run: npm run build:app -- --base="${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: swagger-editor/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
